name: ZEKO Unity Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: zeko-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
      - name: Enable Pages
        run: |
          curl -s -X POST https://api.github.com/repos/${{ github.repository }}/pages -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" -d '{"build_type":"workflow"}' || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
